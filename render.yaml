services:
  - type: web
    name: al-toque-upch
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: al-toque-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: REELS_DELETE_PASSWORD
        sync: false
